name: Updater checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y php-cli php-xml shellcheck
      - name: Shell syntax and help
        run: |
          bash -n updater.sh
          bash updater.sh --help
      - name: ShellCheck
        run: shellcheck updater.sh
      - name: Offline regression tests
        run: python3 tests/test_updater.py
